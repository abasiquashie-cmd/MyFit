let cnfCatalog; async function cnf(endpoint,id){let u='https://food-nutrition.canada.ca/api/canadian-nutrient-file/'+endpoint+'/?lang=en&type=json'+(id?'&id='+encodeURIComponent(id):'');let r=await fetch(u,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Lookup unavailable');let a=await r.json();return Array.isArray(a)?a:[a]}
async function canadaSearch(){let q=$('lookup').value.trim();if(!q)return;let out=$('lookupResults');out.textContent='Searching Health Canada…';try{cnfCatalog??=await cnf('food');let words=q.toLowerCase().split(/\s+/);let matches=cnfCatalog.filter(x=>words.every(w=>String(x.food_description).toLowerCase().includes(w))).slice(0,20);out.innerHTML=matches.map(x=>`<button class="alt wide" onclick="addCNF(${Number(x.food_code)})">${esc(x.food_description)}</button>`).join('')||'No matching food. Try fewer words.'}catch(e){out.textContent='Canadian database unavailable in this browser. Use offline estimates or enter label values.'}}
async function cnfMacros(id){let a=await cnf('nutrientamount',id);let get=(ids,re)=>{let x=a.find(x=>ids.includes(Number(x.nutrient_id??x.nutrient_code??x.nutrient_number)))||a.find(x=>re.test(String(x.nutrient_web_name??x.nutrient_name??'')));let v=x?.nutrient_value;return v==null||v===''?NaN:Number(v)};let k=get([208],/energy.*kcal|calories/i),p=get([203],/^protein/i),c=get([205],/^carbohydrate/i),f=get([204],/^fat|^total lipid/i);if(![k,p,c,f].every(Number.isFinite))throw Error('Incomplete macros');return {k,p,c,f}} 
async function addCNF(id){let out=$('lookupResults'),name=cnfCatalog.find(x=>x.food_code==id)?.food_description||'Canadian food';try{let v=await cnfMacros(id);draft.push({name,g:100,...v,source:'Health Canada CNF'});drawDraft();out.textContent='Added 100 g. Adjust weight.'}catch(e){let f=findLocal(name.toLowerCase());if(f){draft.push({name:f[0],g:100,k:f[1],p:f[2],c:f[3],f:f[4],source:'Generic fallback estimate'});drawDraft();out.textContent='Canadian values unavailable; generic estimate added for review.'}else out.textContent='Canadian values unavailable. Try a simpler food name or enter label values.'}}
function findLocal(s){return foods.filter(f=>f[7].split('|').some(a=>new RegExp('\\b'+a+'\\b').test(s))).sort((a,b)=>Math.max(...b[7].split('|').filter(x=>s.includes(x)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>s.includes(x)).map(x=>x.length)))[0]}
async function barcodeLookup(){let code=$('lookup').value.trim(),out=$('lookupResults');if(!/^\d{8,14}$/.test(code)){out.textContent='Enter the barcode digits first.';return}try{out.textContent='Looking up barcode…';let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,nutriments,countries_tags',{signal:AbortSignal.timeout(12000)});let j=await r.json(),x=j.product,n=x?.nutriments;let vals=['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].map(k=>n?.[k]);if(j.status!==1||!vals.every(v=>v!=null&&Number.isFinite(+v)))throw Error();draft.push({name:x.product_name||code,g:100,k:+vals[0],p:+vals[1],c:+vals[2],f:+vals[3],source:'Open Food Facts · '+(x.countries_tags?.includes('en:canada')?'Canada listed':'market not confirmed')});drawDraft();out.textContent='Check against your Canadian package label; adjust grams.'}catch(e){out.textContent='Barcode not found or incomplete. Use package label values.'}}

async function parse(){let t=$('mealtext').value.toLowerCase().replace(/\b(two|three|four|one|half|five|six|seven|eight|nine|ten)\b/g,x=>({two:'2',three:'3',four:'4',one:'1',half:'0.5',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'}[x]));t=t.replace(/rice and peas/g,'rice & peas').replace(/macaroni and cheese/g,'macaroni & cheese');draft=t.split(/,|\band\b|\n/).map(s=>{s=s.replace(/rice & peas/g,'rice and peas').replace(/macaroni & cheese/g,'macaroni and cheese');let matches=foods.filter(f=>f[7].split('|').some(a=>new RegExp('\\b'+a+'\\b').test(s)));let f=matches.sort((a,b)=>Math.max(...b[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length)))[0];if(s.includes('skinless')&&s.includes('thigh'))f=foods[1];if(!f)return {name:s.trim(),g:100,manual:true,k:0,p:0,c:0,f:0};let n=s.match(/(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)/),q=n?n[0].split(' ').reduce((a,v)=>a+(v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v)),0):1;let g=s.match(/\b(?:g|grams?)\b/)?q:s.match(/\b(?:oz|ounces?)\b/)?q*28.35:s.includes('cup')?q*f[5]: /tbsp|tablespoon/.test(s)?q*f[5]/16:/tsp|teaspoon/.test(s)?q*f[5]/48:q*f[6];return {name:f[0],g:Math.round(g),k:f[1],p:f[2],c:f[3],f:f[4],source:"Generic estimate"}}).filter(x=>x.name);drawDraft();let current=draft;for(let x of current.filter(x=>x.manual)){try{cnfCatalog??=await cnf('food');let q=x.name.replace(/^[\d.]+\s*(?:cups?|grams?|g|oz|slices?)?\s*/i,'').trim();let matches=cnfCatalog.filter(y=>String(y.food_description).toLowerCase()===q);if(matches.length!==1)continue;let v=await cnfMacros(matches[0].food_code);if(draft!==current)return;Object.assign(x,v,{manual:false,source:'Health Canada · review 100 g portion'});drawDraft()}catch(e){}}}
function totals(items){return ['k','p','c','f'].map(k=>Math.round(items.reduce((a,x)=>a+x[k]*x.g/100,0)))}function meals(){return S.meals[day()]||[]}function sum(){return totals(meals().flatMap(x=>x.items))}function bars(a,t){return ['Calories','Protein','Carbs','Fat'].map((n,i)=>`<div class="line"><span>${n}</span><b>${a[i]} / ${t[i]} ${i?'g':'kcal'}</b></div><div class="bar"><i style="width:${Math.min(100,a[i]/t[i]*100)}%"></i></div>`).join('')}
const ex={lower:['Leg press|3|8–12','Leg extension|3|12–15','Seated hamstring curl|3|10–15','Calf raise|3|12–20'],posterior:['Hip thrust|3|10–12','Dumbbell Romanian deadlift|3|8–12','Leg press|3|10–12','Hamstring curl|3|12–15','Calf raise|3|15–20'],push:['Dumbbell bench press|3|8–12','Incline press|3|8–12','Seated shoulder press|3|8–12','Lateral raise|3|12–15','Triceps pushdown|2|12–15'],pull:['Lat pulldown|3|8–12','Chest-supported row|3|10–12','Cable row|2|10–12','Face pull|2|15','Biceps curl|3|10–12'],upper:['Dumbbell bench press|3|8–12','Lat pulldown|3|8–12','Chest-supported row|3|10–12','Lateral raise|2|15','Biceps curl|2|12','Triceps pushdown|2|12'],full:['Leg press|2|12','Incline press|3|10','Lat pulldown|3|10','Hamstring curl|2|12','Lateral raise|2|15','Plank|2|30–45 sec'],mobility:['Brisk walk|1|25 min','Hip flexor stretch|2|30 sec/side','Hamstring stretch|2|30 sec/side','90/90 hip stretch|2|30 sec/side','Dead bug|2|10/side'],rest:[]};const names={lower:'Quads & calves',posterior:'Hamstrings & glutes',push:'Chest, shoulders & triceps',pull:'Back & biceps',upper:'Upper body',full:'Full body',mobility:'Cardio & mobility',rest:'Recovery'};function schedule(){let p=S.profile;if(p.goal==='mobility'||p.days==3)return ['full','mobility','full','rest','full','mobility','rest'];if(p.days==4||p.goal==='cut'||p.goal==='maintain')return ['lower','upper','mobility','posterior','upper','mobility','rest'];return ['lower','push','mobility','pull','posterior','full','rest']}const baseSchedule=schedule; function exerciseList(w){let a=[...ex[w]],p=S.profile.priorities||[];if(w==='rest'||w==='mobility')return a;if(p.includes('legs')&&w==='lower')a.push('Dumbbell step-up|2|10/side');if(p.includes('chest')&&(w==='push'||w==='upper'))a.push('Machine chest fly|2|12–15');if(p.includes('back')&&(w==='pull'||w==='upper'))a.push('Straight-arm pulldown|2|12');if(p.includes('arms')&&(w==='pull'||w==='upper'))a.push('Hammer curl|2|12');if(p.includes('shoulders')&&w==='full')a.push('Face p function grocery(){let d=new Date(day()+'T12:00:00'),bag={};for(let j=0;j<7;j++){let k=dateKey(d);for(let type of mealTypes){let x=planned(k,type);for(let item of recipeItems(x.r,type))bag[item.name]=(bag[item.name]||0)+item.g;}d.setDate(d.getDate()+1)}return Object.entries(bag).sort().map(([n,g])=>`${n}: ${g} g`).join('\n')}
function planned(k,type){let p=picks(type),i=S.plan?.[k+'|'+type];return p.find(x=>x.i===i)||p[((dateSeed(k)+mealTypes.indexOf(type)*3)%p.length+p.length)%p.length]}
function showGrocery(){ $('groceries').textContent=grocery(); }
function favorite(){if(!draft.length||draft.some(x=>x.manual&&!x.k))return alert('Complete nutrition values first.');let name=prompt('Name this meal',draft.map(x=>x.name).join(', '));if(name){S.favorites.push({name,items:JSON.parse(JSON.stringify(draft))});save();render()}}function useFavorite(i){draft=JSON.parse(JSON.stringify(S.favorites[i].items));drawDraft()}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice recognition is not supported here. Use your keyboard microphone instead.');let r=new R();r.lang='en-CA';r.onresult=e=>{$('mealtext').value=e.results[0][0].transcript;parse()};r.onerror=()=>{if($('voiceStatus'))$('voiceStatus').textContent='Voice unavailable. Try typing or keyboard dictation.'};try{r.start()}catch(e){alert('Voice unavailable')}}function restTimer(n){clearInterval(timerId);let end=Date.now()+n*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));if($('timer'))$('timer').textContent=left?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Rest complete';if(!left)clearInterval(timerId)}tick();timerId=setInterval(tick,250)}function coach(a,t){let remaining=t[0]-a[0],protein=t[1]-a[1];return `<p>${remaining>0?'You have '+remaining+' estimated calories remaining.':'You have reached your estimated calorie target. No need to compensate with extra exercise.'}</p><p>${protein>25?'Consider a protein-rich meal such as chicken, fish, tofu or Greek yogurt.':'Your protein intake is approaching or meeting your target.'}</p><small>Review weekly trends and recovery before changing targets. This is not an AI or medical assessment.</small>`}function charts(){return ['Weight (lb)','Waist (in)','Chest (in)','Thigh (in)','Arm (in)'].map((n,i)=>{let v=S.measure.filter(m=>m.v[i]&&Number.isFinite(+m.v[i])).sort((a,b)=>a.date.localeCompare(b.date));if(!v.length)return '';let vals=v.map(m=>+m.v[i]),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;let pts=vals.map((x,j)=>[20+j*260/Math.max(1,vals.length-1),100-(x-lo)/span*75]);return `<p><b>${n}</b> · ${vals.at(-1)}</p><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="${n} trend"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a5ef91" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#a5ef91"/>`).join('')}</svg><small>${esc(v[0].date)} – ${esc(v.at(-1).date)} · range ${lo}–${hi}</small>`}).join('')||'Add measurements to see your trends.'}function drawDraft(){if(!$('draft'))return;$('draft').innerHTML=draft.length?draft.map((x,i)=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${x.manual?'Unknown food — enter label values below':Math.round(x.k*x.g/100)+' kcal · '+esc(x.source||'Generic estimate')}</small></div><input type="number" min="1" aria-label="Grams" value="${x.g}" onchange="draft[${i}].g=Math.max(0,+this.value);drawDraft()"><button class="alt" onclick="draft.splice(${i},1);drawDraft()">×</button></div>${x.manual?['k','p','c','f'].map((k,j)=>`<label>${['Calories','Protein g','Carbs g','Fat g'][j]} per 100 g<input type="number" min="0" value="${x[k]}" onchange="draft[${i}].${k}=Math.max(0,+this.value)"></label>`).join(''):''}`).join('')+`<button class="wide" onclick="logMeal()">Confirm & log meal</button> <button class="alt wide" onclick="favorite()">Save as favourite</button>`:''}function logMeal(){if(draft.some(x=>x.manual&&!x.k)){alert('Enter calories for unknown foods or remove them.');return}(S.meals[day()]??=[]).push({items:draft});draft=[];save();render()}function record(n,k,v){let key=day()+'|'+n;(S.work[key]??={})[k]=v;save()}function updateGoals(){let p={...S.profile};for(let k of ['age','height','weight','activity','days'])p[k]=+$(k).value;for(let k of ['sex','goal'])p[k]=$(k).value;if(p.age<18||p.age>100||p.height<120||p.height>230||p.weight<80||p.weight>600){alert('Check adult profile values.');return}p.priorities=['legs','chest','back','arms','shoulders','core','flexibility'].filter(n=>$('priority-'+n).checked);if(p.priorities.filter(n=>n!=='flexibility').length>3){alert('Choose up to three strength priorities.');return}S.profile=p;save();render()}function measure(){let v=Array.from({length:5},(_,i)=>$('m'+i).value);if(!v.some(Boolean))return;S.measure.push({date:day(),v});save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='myfit-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.profile||!x.meals||!x.work||!Array.isArray(x.measure))throw 0;S=x;S.favorites??=[];S.profile.priorities??=['legs','chest'];save();render()}catch(e){alert('Invalid backup')}}render();let lastDay=today(),lastMeal=autoMeal();setInterval(()=>{let now=today(),mt=autoMeal();if(now!==lastDay){if(day()===lastDay){$('date').value=now;calendarOffset=0;if(tab!=='Food'&&tab!=='Goals')render()}lastDay=now}if(mt!==lastMeal){lastMeal=mt;if(tab==='Planner'&&mealType==='Auto')render()}},30000);</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
