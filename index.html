let cnfCatalog; async function cnf(endpoint,id){let u='https://food-nutrition.canada.ca/api/canadian-nutrient-file/'+endpoint+'/?lang=en&type=json'+(id?'&id='+encodeURIComponent(id):'');let r=await fetch(u,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Lookup unavailable');let a=await r.json();return Array.isArray(a)?a:[a]}
async function canadaSearch(){let q=$('lookup').value.trim();if(!q)return;let out=$('lookupResults');out.textContent='Searching Health Canada…';try{cnfCatalog??=await cnf('food');let words=q.toLowerCase().split(/\s+/);let matches=cnfCatalog.filter(x=>words.every(w=>String(x.food_description).toLowerCase().includes(w))).slice(0,20);out.innerHTML=matches.map(x=>`<button class="alt wide" onclick="addCNF(${Number(x.food_code)})">${esc(x.food_description)}</button>`).join('')||'No matching food. Try fewer words.'}catch(e){out.textContent='Canadian database unavailable in this browser. Use offline estimates or enter label values.'}}
async function cnfMacros(id){let a=await cnf('nutrientamount',id);let get=(ids,re)=>{let x=a.find(x=>ids.includes(Number(x.nutrient_id??x.nutrient_code??x.nutrient_number)))||a.find(x=>re.test(String(x.nutrient_web_name??x.nutrient_name??'')));let v=x?.nutrient_value;return v==null||v===''?NaN:Number(v)};let k=get([208],/energy.*kcal|calories/i),p=get([203],/^protein/i),c=get([205],/^carbohydrate/i),f=get([204],/^fat|^total lipid/i);if(![k,p,c,f].every(Number.isFinite))throw Error('Incomplete macros');return {k,p,c,f}} 
async function addCNF(id){let out=$('lookupResults'),name=cnfCatalog.find(x=>x.food_code==id)?.food_description||'Canadian food';try{let v=await cnfMacros(id);draft.push({name,g:100,...v,source:'Health Canada CNF'});drawDraft();out.textContent='Added 100 g. Adjust weight.'}catch(e){let f=findLocal(name.toLowerCase());if(f){draft.push({name:f[0],g:100,k:f[1],p:f[2],c:f[3],f:f[4],source:'Generic fallback estimate'});drawDraft();out.textContent='Canadian values unavailable; generic estimate added for review.'}else out.textContent='Canadian values unavailable. Try a simpler food name or enter label values.'}}

async function barcodeLookup(){let code=$('lookup').value.trim(),out=$('lookupResults');if(!/^\d{8,14}$/.test(code)){out.textContent='Enter the barcode digits first.';return}try{out.textContent='Looking up barcode…';let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,nutriments,countries_tags',{signal:AbortSignal.timeout(12000)});let j=await r.json(),x=j.product,n=x?.nutriments;let vals=['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].map(k=>n?.[k]);if(j.status!==1||!vals.every(v=>v!=null&&Number.isFinite(+v)))throw Error();draft.push({name:x.product_name||code,g:100,k:+vals[0],p:+vals[1],c:+vals[2],f:+vals[3],source:'Open Food Facts · '+(x.countries_tags?.includes('en:canada')?'Canada listed':'market not confirmed')});drawDraft();out.textContent='Check against your Canadian package label; adjust grams.'}catch(e){out.textContent='Barcode not found or incomplete. Use package label values.'}}

async function parse(){let t=$('mealtext').value.toLowerCase().replace(/\b(two|three|four|one|half|five|six|seven|eight|nine|ten)\b/g,x=>({two:'2',three:'3',four:'4',one:'1',half:'0.5',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'}[x]));t=t.replace(/rice and peas/g,'rice & peas').replace(/macaroni and cheese/g,'macaroni & cheese');draft=t.split(/,|;|\band\b|\bwith\b|\bplus\b|\n/).map(s=>{s=s.replace(/rice & peas/g,'rice and peas').replace(/macaroni & cheese/g,'macaroni and cheese');let matches=foods.filter(f=>f[7].split('|').some(a=>new RegExp('\\b'+a+'\\b').test(s)));let f=matches.sort((a,b)=>Math.max(...b[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length)))[0];if(s.includes('skinless')&&s.includes('thigh'))f=foods[1];if(!f)return {name:s.trim(),g:100,manual:true,k:0,p:0,c:0,f:0};let n=s.match(/(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)/),q=n?n[0].split(' ').reduce((a,v)=>a+(v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v)),0):1;let g=s.match(/\b(?:kg|kilograms?)\b/)?q*1000:s.match(/\b(?:g|grams?)\b/)?q:s.match(/\b(?:oz|ounces?)\b/)?q*28.35:s.includes('cup')?q*f[5]: /tbsp|tablespoon/.test(s)?q*f[5]/16:/tsp|teaspoon/.test(s)?q*f[5]/48:q*f[6];return {name:f[0],g:Math.round(g),k:f[1],p:f[2],c:f[3],f:f[4],source:"Generic estimate"}}).filter(x=>x.name);drawDraft();let current=draft;for(let x of current.filter(x=>x.manual)){try{cnfCatalog??=await cnf('food');let q=x.name.replace(/^[\d.]+\s*(?:cups?|grams?|g|oz|slices?)?\s*/i,'').trim();let matches=cnfCatalog.filter(y=>String(y.food_description).toLowerCase()===q);if(matches.length!==1)continue;let v=await cnfMacros(matches[0].food_code);if(draft!==current)return;Object.assign(x,v,{manual:false,source:'Health Canada · review 100 g portion'});drawDraft()}catch(e){}}}
function totals(items){return ['k','p','c','f'].map(k=>Math.round(items.reduce((a,x)=>a+x[k]*x.g/100,0)))}function meals(){return S.meals[day()]||[]}function sum(){return totals(meals().flatMap(x=>x.items))}function bars(a,t){return ['Calories','Protein','Carbs','Fat'].map((n,i)=>`<div class="line"><span>${n}</span><b>${a[i]} / ${t[i]} ${i?'g':'kcal'}</b></div><div class="bar"><i style="width:${Math.min(100,a[i]/t[i]*100)}%"></i></div>`).join('')}
const ex={lower:['Leg press|3|8–12','Leg extension|3|12–15','Seated hamstring curl|3|10–15','Calf raise|3|12–20'],posterior:['Hip thrust|3|10–12','Dumbbell Romanian deadlift|3|8–12','Leg press|3|10–12','Hamstring curl|3|12–15','Calf raise|3|15–20'],push:['Dumbbell bench press|3|8–12','Incline press|3|8–12','Seated shoulder press|3|8–12','Lateral raise|3|12–15','Triceps pushdown|2|12–15'],pull:['Lat pulldown|3|8–12','Chest-supported row|3|10–12','Cable row|2|10–12','Face pull|2|15','Biceps curl|3|10–12'],upper:['Dumbbell bench press|3|8–12','Lat pulldown|3|8–12','Chest-supported row|3|10–12','Lateral raise|2|15','Biceps curl|2|12','Triceps pushdown|2|12'],full:['Leg press|2|12','Incline press|3|10','Lat pulldown|3|10','Hamstring curl|2|12','Lateral raise|2|15','Plank|2|30–45 sec'],mobility:['Brisk walk|1|25 min','Hip flexor stretch|2|30 sec/side','Hamstring stretch|2|30 sec/side','90/90 hip stretch|2|30 sec/side','Dead bug|2|10/side'],rest:[]};const names={lower:'Quads & calves',posterior:'Hamstrings & glutes',push:'Chest, shoulders & triceps',pull:'Back & biceps',upper:'Upper body',full:'Full body',mobility:'Cardio & mobility',rest:'Recovery'};function schedule(){let p=S.profile;if(p.goal==='mobility'||p.days==3)return ['full','mobility','full','rest','full','mobility','rest'];if(p.days==4||p.goal==='cut'||p.goal==='maintain')return ['lower','upper','mobility','posterior','upper','mobility','rest'];return ['lower','push','mobility','pull','posterior','full','rest']}const baseSchedule=schedule; function exerciseList(w){let a=[...ex[w]],p=S.profile.priorities||[];if(w==='rest'||w==='mobility')return a;if(p.includes('legs')&&w==='lower')a.push('Dumbbell step-up|2|10/side');if(p.includes('chest')&&(w==='push'||w==='upper'))a.push('Machine chest fly|2|12–15');if(p.includes('back')&&(w==='pull'||w==='upper'))a.push('Straight-arm pulldown|2|12');if(p.includes('arms')&&(w==='pull'||w==='upper'))a.push('Hammer curl|2|12');if(p.includes('shoulders')&&w==='full')a.push('Face p let recipeServings=1; let cuisine='All cuisines',mealBudget='meal',mealType='Auto',rotation=0,calendarOffset=0;
function autoMeal(){let h=new Date().getHours();return h>=5&&h<11?'Breakfast':h>=11&&h<15?'Lunch':h>=17&&h<22?'Dinner':'Snack'}
function activeMeal(){return mealType==='Auto'?autoMeal():mealType}
function recipeItems(r,type=activeMeal()){let t=targets(),a=sum(),budget=mealBudget==='remaining'?Math.max(0,t[0]-a[0]):t[0]*({Breakfast:.25,Lunch:.30,Dinner:.35,Snack:.10}[type]);let base=r[2].map(([n,g])=>{let f=foods.find(x=>x[0]===n);if(!f)throw Error("Missing ingredient: "+n);return {name:n,g,k:f[1],p:f[2],c:f[3],f:f[4],source:'Generic recipe estimate'}});let scale=Math.max(.5,Math.min(1.6,budget/Math.max(1,totals(base)[0])));return base.map(x=>({...x,g:Math.round(x.g*scale)}))}
function dateSeed(d){return Math.floor(Date.parse(d+'T00:00:00Z')/86400000)}
let pantry='',dishSearch=''; function matchesRecipe(x){return (!pantry||x.r[2].some(([n])=>n.includes(pantry.toLowerCase())))&&(!dishSearch||x.r[1].toLowerCase().includes(dishSearch.toLowerCase()))} function picks(type,c='All cuisines'){return recipes.map((r,i)=>({r,i})).filter(x=>x.r[4].includes(type)&&(c==='All cuisines'||x.r[0]===c))}
function calendarPlanner(){let d=new Date(day()+'T12:00:00');if(!Number.isFinite(+d))d=new Date();let m=new Date(d.getFullYear(),d.getMonth()+calendarOffset,1,12),start=new Date(m);start.setDate(1-m.getDay());let cells=Array.from({length:42},(_,i)=>{let x=new Date(start);x.setDate(x.getDate()+i);let k=dateKey(x);return `<button class="${k===day()?'':'alt'}" style="padding:8px 2px;opacity:${x.getMonth()===m.getMonth()?1:.45}" onclick="selectPlanDate('${k}')">${x.getDate()}${k===today()?' •':''}</button>`}).join('');return `<section><div class="line"><button class="alt" onclick="calendarOffset--;render()">‹</button><b>${m.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><button class="alt" onclick="calendarOffset++;render()">›</button></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center">${['S','M','T','W','T','F','S'].map(x=>'<small>'+x+'</small>').join('')}${cells}</div><button class="alt wide" style="margin-top:10px" onclick="selectPlanDate(today())">Today</button><h3>${d.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})}</h3><small>Suggested menu · rotates meals to reduce repetition. Portions follow current goals, not an exact daily macro match.</small><button class="alt wide" style="margin:12px 0" onclick="if(confirm('Replace the next seven days of planned meals?'))regenerateWeek()">Regenerate next 7 days</button>${mealTypes.map((type,j)=>{let p=picks(type),idx=((dateSeed(day())+j*3)%p.length+p.length)%p.length,x=planned(day(),type);return `<div class="line"><div><small>${type}</small><br><b>${x.r[1]}</b></div><button class="alt" onclick="openPlanned(${x.i},'${type}')">View recipe</button></div>`}).join('')}</section>`}
function selectPlanDate(k){$('date').value=k;calendarOffset=0;rotation=0;render()}
function openPlanned(i,type){pantry='';dishSearch='';mealType=type;cuisine=recipes[i][0];let p=picks(type,cuisine);rotation=p.findIndex(x=>x.i===i)-dateSeed(day());render();$('fullRecipe')?.scrollIntoView({behavior:'smooth',block:'start'})}
function themedPlanner(){let type=activeMeal(),p=picks(type,cuisine).filter(matchesRecipe),start=((dateSeed(day())+rotation)%p.length+p.length)%p.length;let x=p[start];return `<section id="recipeFinder"><div class="pill">Goal-based recipe finder · ${recipes.length} options</div><h3>What are you craving?</h3><label>Meal time<select onchange="mealType=this.value;rotation=0;render()">${['Auto',...mealTypes].map(n=>`<option value="${n}" ${n===mealType?'selected':''}>${n==='Auto'?'Auto · '+autoMeal():n}</option>`).join('')}</select></label><label>Cuisine<select onchange="cuisine=this.value;rotation=0;render()">${['All cuisines',...new Set(recipes.map(r=>r[0]))].map(n=>`<option ${n===cuisine?'selected':''}>${n}</option>`).join('')}</select></label><label>Search dish name<input value="${esc(dishSearch)}" placeholder="e.g. masala" onchange="dishSearch=this.value.trim();rotation=0;render()"></label><label>Ingredient you have<input id="pantry" value="${esc(pantry)}" placeholder="e.g. chicken" onchange="pantry=this.value.trim();rotation=0;render()"></label><label>Portion target<select onchange="mealBudget=this.value;render()"><option value="meal" ${mealBudget==='meal'?'selected':''}>Meal share of daily calories</option><option value="remaining" ${mealBudget==='remaining'?'selected':''}>Remaining daily calories</option></select></label><small>Cooked weights unless noted. Estimates and portion limits apply.</small>${x?`<div class="recipe-actions"><button onclick="showRecipe()">View full recipe & ingredients</button><label>Browse recipes<select onchange="chooseRecipe(+this.value)">${p.map(y=>`<option value="${y.i}" ${y.i===x.i?'selected':''}>${esc(y.r[1])}</option>`).join('')}</select></label><button class="alt" onclick="nextRecipe(false)" ${p.length<2?'disabled':''}>Try another recipe (${p.length} available)</button><button class="alt" onclick="nextRecipe(true)" ${p.length<2?'disabled':''}>Surprise me</button></div>${recipeCard(x)}`:'<p>No matching recipe. Try another cuisine or
