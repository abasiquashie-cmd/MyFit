let cnfCatalog; async function cnf(endpoint,id){let u='https://food-nutrition.canada.ca/api/canadian-nutrient-file/'+endpoint+'/?lang=en&type=json'+(id?'&id='+encodeURIComponent(id):'');let r=await fetch(u,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Lookup unavailable');let a=await r.json();return Array.isArray(a)?a:[a]}
async function canadaSearch(){let q=$('lookup').value.trim();if(!q)return;let out=$('lookupResults');out.textContent='Searching Health Canada…';try{cnfCatalog??=await cnf('food');let words=q.toLowerCase().split(/\s+/);let matches=cnfCatalog.filter(x=>words.every(w=>String(x.food_description).toLowerCase().includes(w))).slice(0,20);out.innerHTML=matches.map(x=>`<button class="alt wide" onclick="addCNF(${Number(x.food_code)})">${esc(x.food_description)}</button>`).join('')||'No matching food. Try fewer words.'}catch(e){out.textContent='Canadian database unavailable in this browser. Use offline estimates or enter label values.'}}
async function cnfMacros(id){let a=await cnf('nutrientamount',id);let get=(ids,re)=>{let x=a.find(x=>ids.includes(Number(x.nutrient_id??x.nutrient_code??x.nutrient_number)))||a.find(x=>re.test(String(x.nutrient_web_name??x.nutrient_name??'')));let v=x?.nutrient_value;return v==null||v===''?NaN:Number(v)};let k=get([208],/energy.*kcal|calories/i),p=get([203],/^protein/i),c=get([205],/^carbohydrate/i),f=get([204],/^fat|^total lipid/i);if(![k,p,c,f].every(Number.isFinite))throw Error('Incomplete macros');return {k,p,c,f}} 
async function addCNF(id){let out=$('lookupResults'),name=cnfCatalog.find(x=>x.food_code==id)?.food_description||'Canadian food';try{let v=await cnfMacros(id);draft.push({name,g:100,...v,source:'Health Canada CNF'});drawDraft();out.textContent='Added 100 g. Adjust weight.'}catch(e){let f=findLocal(name.toLowerCase());if(f){draft.push({name:f[0],g:100,k:f[1],p:f[2],c:f[3],f:f[4],source:'Generic fallback estimate'});drawDraft();out.textContent='Canadian values unavailable; generic estimate added for review.'}else out.textContent='Canadian values unavailable. Try a simpler food name or enter label values.'}}
function findLocal(s){return foods.filter(f=>f[7].split('|').some(a=>new RegExp('\\b'+a+'\\b').test(s))).sort((a,b)=>Math.max(...b[7].split('|').filter(x=>s.includes(x)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>s.includes(x)).map(x=>x.length)))[0]}
async function barcodeLookup(){let code=$('lookup').value.trim(),out=$('lookupResults');if(!/^\d{8,14}$/.test(code)){out.textContent='Enter the barcode digits first.';return}try{out.textContent='Looking up barcode…';let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,nutriments,countries_tags',{signal:AbortSignal.timeout(12000)});let j=await r.json(),x=j.product,n=x?.nutriments;let vals=['energy-kcal_100g','proteins_100g','carbohydrates_100g','fat_100g'].map(k=>n?.[k]);if(j.status!==1||!vals.every(v=>v!=null&&Number.isFinite(+v)))throw Error();draft.push({name:x.product_name||code,g:100,k:+vals[0],p:+vals[1],c:+vals[2],f:+vals[3],source:'Open Food Facts · '+(x.countries_tags?.includes('en:canada')?'Canada listed':'market not confirmed')});drawDraft();out.textContent='Check against your Canadian package label; adjust grams.'}catch(e){out.textContent='Barcode not found or incomplete. Use package label values.'}}

async function parse(){let t=$('mealtext').value.toLowerCase().replace(/\b(two|three|four|one|half|five|six|seven|eight|nine|ten)\b/g,x=>({two:'2',three:'3',four:'4',one:'1',half:'0.5',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'}[x]));t=t.replace(/rice and peas/g,'rice & peas').replace(/macaroni and cheese/g,'macaroni & cheese');draft=t.split(/,|\band\b|\n/).map(s=>{s=s.replace(/rice & peas/g,'rice and peas').replace(/macaroni & cheese/g,'macaroni and cheese');let matches=foods.filter(f=>f[7].split('|').some(a=>new RegExp('\\b'+a+'\\b').test(s)));let f=matches.sort((a,b)=>Math.max(...b[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>new RegExp('\\b'+x+'\\b').test(s)).map(x=>x.length)))[0];if(s.includes('skinless')&&s.includes('thigh'))f=foods[1];if(!f)return {name:s.trim(),g:100,manual:true,k:0,p:0,c:0,f:0};let n=s.match(/(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)/),q=n?n[0].split(' ').reduce((a,v)=>a+(v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v)),0):1;let g=s.match(/\b(?:g|grams?)\b/)?q:s.match(/\b(?:oz|ounces?)\b/)?q*28.35:s.includes('cup')?q*f[5]: /tbsp|tablespoon/.test(s)?q*f[5]/16:/tsp|teaspoon/.test(s)?q*f[5]/48:q*f[6];return {name:f[0],g:Math.round(g),k:f[1],p:f[2],c:f[3],f:f[4],source:"Generic estimate"}}).filter(x=>x.name);drawDraft();let current=draft;for(let x of current.filter(x=>x.manual)){try{cnfCatalog??=await cnf('food');let q=x.name.replace(/^[\d.]+\s*(?:cups?|grams?|g|oz|slices?)?\s*/i,'').trim();let matches=cnfCatalog.filter(y=>String(y.food_description).toLowerCase()===q);if(matches.length!==1)continue;let v=await cnfMacros(matches[0].food_code);if(draft!==current)return;Object.assign(x,v,{manual:false,source:'Health Canada · review 100 g portion'});drawDraft()}catch(e){}}}
function totals(items){return ['k','p','c','f'].map(k=>Math.round(items.reduce((a,x)=>a+x[k]*x.g/100,0)))}function meals(){return S.meals[day()]||[]}function sum(){return totals(meals().flatMap(x=>x.items))}function bars(a,t){return ['Calories','Protein','Carbs','Fat'].map((n,i)=>`<div class="line"><span>${n}</span><b>${a[i]} / ${t[i]} ${i?'g':'kcal'}</b></div><div class="bar"><i style="width:${Math.min(100,a[i]/t[i]*100)}%"></i></div>`).join('')}
const ex={lower:['Leg press|3|8–12','Leg extension|3|12–15','Seated hamstring curl|3|10–15','Calf raise|3|12–20'],posterior:['Hip thrust|3|10–12','Dumbbell Romanian deadlift|3|8–12','Leg press|3|10–12','Hamstring curl|3|12–15','Calf raise|3|15–20'],push:['Dumbbell bench press|3|8–12','Incline press|3|8–12','Seated shoulder press|3|8–12','Lateral raise|3|12–15','Triceps pushdown|2|12–15'],pull:['Lat pulldown|3|8–12','Chest-supported row|3|10–12','Cable row|2|10–12','Face pull|2|15','Biceps curl|3|10–12'],upper:['Dumbbell bench press|3|8–12','Lat pulldown|3|8–12','Chest-supported row|3|10–12','Lateral raise|2|15','Biceps curl|2|12','Triceps pushdown|2|12'],full:['Leg press|2|12','Incline press|3|10','Lat pulldown|3|10','Hamstring curl|2|12','Lateral raise|2|15','Plank|2|30–45 sec'],mobility:['Brisk walk|1|25 min','Hip flexor stretch|2|30 sec/side','Hamstring stretch|2|30 sec/side','90/90 hip stretch|2|30 sec/side','Dead bug|2|10/side'],rest:[]};const names={lower:'Quads & calves',posterior:'Hamstrings & glutes',push:'Chest, shoulders & triceps',pull:'Back & biceps',upper:'Upper body',full:'Full body',mobility:'Cardio & mobility',rest:'Recovery'};function schedule(){let p=S.profile;if(p.goal==='mobility'||p.days==3)return ['full','mobility','full','rest','full','mobility','rest'];if(p.days==4||p.goal==='cut'||p.goal==='maintain')return ['lower','upper','mobility','posterior','upper','mobility','rest'];return ['lower','push','mobility','pull','posterior','full','rest']}const baseSchedule=schedule; function exerciseList(w){let a=[...ex[w]],p=S.profile.priorities||[];if(w==='rest'||w==='mobility')return a;if(p.includes('legs')&&w==='lower')a.push('Dumbbell step-up|2|10/side');if(p.includes('chest')&&(w==='push'||w==='upper'))a.push('Machine chest fly|2|12–15');if(p.includes('back')&&(w==='pull'||w==='upper'))a.push('Straight-arm pulldown|2|12');if(p.includes('arms')&&(w==='pull'||w==='upper'))a.push('Hammer curl|2|12');if(p.includes('shoulders')&&w==='full')a.push('Face pull|2|15');if(p.includes('core')&&(w==='lower'||w==='upper'))a.push('Dead bug|2|10/side');if(p.includes('flexibility'))a.push('Hip flexor stretch|1|30 sec/side');return a;} function workout(){return schedule()[(new Date(day()+'T12:00:00').getDay()+6)%7]}
function render(){let t=targets(),a=sum(),w=workout();$('nav').innerHTML=['Home','Food','Workout','Planner','Goals','Progress'].map((n,i)=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()"><span>${['⌂','◉','◆','▦','◎','↗'][i]}</span>${n}</button>`).join('');let h='';if(tab==='Home')h=`<div class="pill">${goals[S.profile.goal]}</div><h2>Your daily overview</h2><section><div class="ring" style="--p:${Math.min(100,a[0]/t[0]*100)}%"><div><span class="metric">${a[0]}</span><small>of ${t[0]} kcal</small></div></div><center>${t[0]-a[0]} kcal remaining</center>${bars(a,t)}<button class="wide" onclick="tab='Food';render()">+ Log a meal</button></section><section><small>TODAY'S TRAINING</small><h2>${names[w]}</h2><button onclick="tab='Workout';render()">Open workout</button></section>`;if(tab==='Home')h+=`<section><div class="pill">MyFit coach · rule-based</div><h3>Today's guidance</h3>${coach(a,t)}</section>`;if(tab==='Food')h=`<h2>Food diary</h2><section>${bars(a,t)}</section><section><h3>Describe your meal</h3><textarea id="mealtext" placeholder="2 chicken thighs with skin on, 1 cup white rice, 1 cup broccoli"></textarea><button onclick="parse()">Estimate nutrition</button> <button class="alt" onclick="voice()">🎙 Voice</button><div id="voiceStatus" class="muted"></div><h3>🇨🇦 Canadian food lookup</h3><input id="lookup" placeholder="Food name or barcode digits"><button class="alt" onclick="canadaSearch()">Search Health Canada</button> <button class="alt" onclick="barcodeLookup()">Barcode lookup</button><div id="lookupResults" class="muted"></div><small>Online lookup sends only your search or barcode to the selected service. Generic estimates are not restaurant-specific.</small><h3>Saved meals</h3>${S.favorites.map((f,i)=>`<div class="line"><button class="alt" onclick="useFavorite(${i})">${esc(f.name)}</button><button class="alt" onclick="S.favorites.splice(${i},1);save();render()">Remove</button></div>`).join('')||'Save a meal after estimating it.'}<p class="muted">Use commas between foods. Estimates assume cooked edible portions except dry oats. Confirm weights and add oils or sauces separately.</p><div id="draft"></div></section><section><h3>Logged meals</h3>${meals().map((m,i)=>`<div class="line"><div>${esc(m.items.map(x=>x.name).join(', '))}<br><small>${totals(m.items)[0]} kcal</small></div><button class="alt" onclick="S.meals[day()].splice(${i},1);save();render()">Delete</button></div>`).join('')||'No meals logged yet.'}</section>`;if(tab==='Workout')h=`<h2>Training</h2><section>${schedule().map((x,i)=>`<div class="line"><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small><b>${names[x]}</b></div>`).join('')}</section><section><h3>${names[w]}</h3><small>Warm up first. Leave 1–3 reps in reserve. No barbell back squats.</small>${exerciseList(w).map((x,i)=>{let [n,s,r]=x.split('|');let key=day()+'|'+n,log=S.work[key]||{};return `<div class="line"><div><b>${n}</b><br><small>${s} sets × ${r}</small></div><input aria-label="Weight in pounds" type="number" min="0" placeholder="lb" value="${esc(log.weight||'')}" onchange="record('${n}','weight',this.value)"><input aria-label="Sets completed" type="number" min="0" max="${s}" placeholder="sets" value="${esc(log.sets||'')}" onchange="record('${n}','sets',this.value)"></div>`}).join('')||'Take an easy walk and recover.'}<div class="line"><button onclick="restTimer(90)">90 sec rest</button><button class="alt" onclick="restTimer(120)">2 min</button><b id="timer">Ready</b></div><p class="muted">Enter weight and completed sets; entries save automatically. For mobility, leave weight blank.</p></section>`;if(tab==='Goals')h=`<h2>Your goals</h2><section><label>Primary goal<select id="goal">${Object.entries(goals).map(([k,v])=>`<option value="${k}" ${S.profile.goal===k?'selected':''}>${v}</option>`)}</select></label>${[['age','Age'],['height','Height (cm)'],['weight','Weight (lb)']].map(([k,n])=>`<label>${n}<input id="${k}" type="number" value="${S.profile[k]}"></label>`).join('')}<label>Sex used for calorie estimate<select id="sex"><option value="male" ${S.profile.sex==='male'?'selected':''}>Male</option><option value="female" ${S.profile.sex==='female'?'selected':''}>Female</option></select></label><label>Activity<select id="activity">${[[1.2,'Sedentary'],[1.375,'Light'],[1.5,'Moderate'],[1.725,'Very active']].map(([v,n])=>`<option value="${v}" ${S.profile.activity==v?'selected':''}>${n}</option>`)}</select></label><label>Preferred lifting days<select id="days">${[3,4,5].map(v=>`<option ${S.profile.days==v?'selected':''}>${v}</option>`)}</select></label><h3>Muscle priorities</h3><small>Choose up to three strength priorities plus flexibility.</small>${['legs','chest','back','arms','shoulders','core','flexibility'].map(n=>`<label class="line">${n}<input type="checkbox" style="width:22px" id="priority-${n}" ${S.profile.priorities.includes(n)?'checked':''}></label>`).join('')}<button class="wide" onclick="updateGoals()">Apply goals & regenerate plan</button><p class="muted">Calorie estimates are provisional. Fat loss and maintenance cap lifting at four days; mobility uses three. Back squats excluded.</p></section><section>${bars([0,0,0,0],t)}</section>`;if(tab==='Planner'){let breakfasts=['Protein oats & banana','Eggs & toast','Greek yogurt & berries'],lunch=['Jerk chicken & rice','Turkey & pasta','Tuna & potato','Chicken & beans'],dinner=['Salmon & sweet potato','Lean beef & rice','Shrimp & pasta','Chicken & potatoes'];h=`<h2>30-day meal plan</h2>${themedPlanner()}<section><div class="pill">${t[0]} kcal daily target</div><p>Starting portions: ${Math.round(t[0]/2450*150)} g cooked protein, ${Math.round(t[0]/2450*160)} g cooked starch and 150 g vegetables per main meal. Add breakfast and snacks to meet your targets. This is a meal template, not an exact macro-matched menu.</p></section>${Array.from({length:4},(_,i)=>`<section><h3>Week ${i+1}</h3><table><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr>${Array.from({length:i===3?9:7},(_,j)=>`<tr><td>${i*7+j+1}</td><td>${breakfasts[(i+j)%3]}</td><td>${lunch[(i+Math.floor(j/2))%4]}</td><td>${dinner[(i+j)%4]}</td></tr>`).join('')}</table></section>`).join('')}<section><h3>Weekly grocery guide</h3>Chicken, turkey, salmon, shrimp, eggs, Greek yogurt, oats, rice, potatoes, pasta, beans, broccoli, mixed vegetables, fruit and olive oil. Prep twice weekly; freeze later portions.</section>`}if(tab==='Progress')h=`<h2>Progress journal</h2><section>${['Weight (lb)','Waist (in)','Chest (in)','Thigh (in)','Arm (in)'].map((n,i)=>`<label>${n}<input type="number" min="0" step="0.1" id="m${i}"></label>`).join('')}<button onclick="measure()">Save measurements</button></section><section><h3>Measurement trends</h3>${charts()}<h3>History</h3>${S.measure.map(m=>`<div class="line"><small>${esc(m.date)}</small><span>${m.v.map((v,i)=>v?['Weight','Waist','Chest','Thigh','Arm'][i]+': '+esc(v):'').filter(Boolean).join(' · ')}</span></div>`).join('')||'No measurements yet.'}</section><section><h3>Data backup</h3><button onclick="backup()">Export JSON</button><label style="margin-top:12px">Restore backup<input type="file" accept=".json" onchange="restore(this)"></label><small>Data stays in this browser when local storage is supported. Export regularly.</small></section>`;$('app').innerHTML=h;if(tab==='Food')drawDraft()}

let cuisine='Mexican',mealBudget='meal';function recipeItems(r){let t=targets(),a=sum(),budget=mealBudget==='remaining'?Math.max(0,t[0]-a[0]):t[0]*.30;let base=r[2].map(([n,g])=>{let f=foods.find(x=>x[0]===n);return {name:n,g,k:f[1],p:f[2],c:f[3],f:f[4],source:'Generic recipe estimate'}});let scale=Math.max(.5,Math.min(1.6,budget/Math.max(1,totals(base)[0])));return base.map(x=>({...x,g:Math.round(x.g*scale)}))}function themedPlanner(){return `<section><div class="pill">Goal-based recipe finder</div><h3>What are you craving?</h3><label>Cuisine<select onchange="cuisine=this.value;render()">${[...new Set(recipes.map(r=>r[0]))].map(n=>`<option ${n===cuisine?'selected':''}>${n}</option>`).join('')}</select></label><label>Portion target<select onchange="mealBudget=this.value;render()"><option value="meal" ${mealBudget==='meal'?'selected':''}>About 30% of daily calories</option><option value="remaining" ${mealBudget==='remaining'?'selected':''}>Remaining daily calories</option></select></label><small>Portions use your current goal. Estimates are not exact; check labels and seasonings. Cooked weights unless noted. Portion scaling is limited to practical servings.</small>${recipes.map((r,i)=>{if(r[0]!==cuisine)return '';let items=recipeItems(r),v=totals(items);return `<section><h3>${r[1]}</h3><b>${v[0]} kcal · ${v[1]} g protein</b><p>${v[2]} g carbs · ${v[3]} g fat</p>${items.map(x=>`<div class="line"><span>${x.name}</span><b>${x.g} g</b></div>`).join('')}<p>${r[3]}</p><button class="wide" onclick="useRecipe(${i})">Use recipe in food diary</button></section>`}).join('')}</section>`}function useRecipe(i){draft=recipeItems(recipes[i]);tab='Food';render()}
function favorite(){if(!draft.length||draft.some(x=>x.manual&&!x.k))return alert('Complete nutrition values first.');let name=prompt('Name this meal',draft.map(x=>x.name).join(', '));if(name){S.favorites.push({name,items:JSON.parse(JSON.stringify(draft))});save();render()}}function useFavorite(i){draft=JSON.parse(JSON.stringify(S.favorites[i].items));drawDraft()}function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice recognition is not supported here. Use your keyboard microphone instead.');let r=new R();r.lang='en-CA';r.onresult=e=>{$('mealtext').value=e.results[0][0].transcript;parse()};r.onerror=()=>{if($('voiceStatus'))$('voiceStatus').textContent='Voice unavailable. Try typing or keyboard dictation.'};try{r.start()}catch(e){alert('Voice unavailable')}}function restTimer(n){clearInterval(timerId);let end=Date.now()+n*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));if($('timer'))$('timer').textContent=left?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'Rest complete';if(!left)clearInterval(timerId)}tick();timerId=setInterval(tick,250)}function coach(a,t){let remaining=t[0]-a[0],protein=t[1]-a[1];return `<p>${remaining>0?'You have '+remaining+' estimated calories remaining.':'You have reached your estimated calorie target. No need to compensate with extra exercise.'}</p><p>${protein>25?'Consider a protein-rich meal such as chicken, fish, tofu or Greek yogurt.':'Your protein intake is approaching or meeting your target.'}</p><small>Review weekly trends and recovery before changing targets. This is not an AI or medical assessment.</small>`}function charts(){return ['Weight (lb)','Waist (in)','Chest (in)','Thigh (in)','Arm (in)'].map((n,i)=>{let v=S.measure.filter(m=>m.v[i]&&Number.isFinite(+m.v[i])).sort((a,b)=>a.date.localeCompare(b.date));if(!v.length)return '';let vals=v.map(m=>+m.v[i]),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;let pts=vals.map((x,j)=>[20+j*260/Math.max(1,vals.length-1),100-(x-lo)/span*75]);return `<p><b>${n}</b> · ${vals.at(-1)}</p><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="${n} trend"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a5ef91" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#a5ef91"/>`).join('')}</svg><small>${esc(v[0].date)} – ${esc(v.at(-1).date)} · range ${lo}–${hi}</small>`}).join('')||'Add measurements to see your trends.'}function drawDraft(){if(!$('draft'))return;$('draft').innerHTML=draft.length?draft.map((x,i)=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${x.manual?'Unknown food — enter label values below':Math.round(x.k*x.g/100)+' kcal · '+esc(x.source||'Generic estimate')}</small></div><input type="number" min="1" aria-label="Grams" value="${x.g}" onchange="draft[${i}].g=Math.max(0,+this.value);drawDraft()"><button class="alt" onclick="draft.splice(${i},1);drawDraft()">×</button></div>${x.manual?['k','p','c','f'].map((k,j)=>`<label>${['Calories','Protein g','Carbs g','Fat g'][j]} per 100 g<input type="number" min="0" value="${x[k]}" onchange="draft[${i}].${k}=Math.max(0,+this.value)"></label>`).join(''):''}`).join('')+`<button class="wide" onclick="logMeal()">Confirm & log meal</button> <button class="alt wide" onclick="favorite()">Save as favourite</button>`:''}function logMeal(){if(draft.some(x=>x.manual&&!x.k)){alert('Enter calories for unknown foods or remove them.');return}(S.meals[day()]??=[]).push({items:draft});draft=[];save();render()}function record(n,k,v){let key=day()+'|'+n;(S.work[key]??={})[k]=v;save()}function updateGoals(){let p={...S.profile};for(let k of ['age','height','weight','activity','days'])p[k]=+$(k).value;for(let k of ['sex','goal'])p[k]=$(k).value;if(p.age<18||p.age>100||p.height<120||p.height>230||p.weight<80||p.weight>600){alert('Check adult profile values.');return}p.priorities=['legs','chest','back','arms','shoulders','core','flexibility'].filter(n=>$('priority-'+n).checked);if(p.priorities.filter(n=>n!=='flexibility').length>3){alert('Choose up to three strength priorities.');return}S.profile=p;save();render()}function measure(){let v=Array.from({length:5},(_,i)=>$('m'+i).value);if(!v.some(Boolean))return;S.measure.push({date:day(),v});save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='myfit-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.profile||!x.meals||!x.work||!Array.isArray(x.measure))throw 0;S=x;S.favorites??=[];S.profile.priorities??=['legs','chest'];save();render()}catch(e){alert('Invalid backup')}}render();</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
