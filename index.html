*{box-sizing:border-box}body{margin:0;background:#101714;color:#eef5ef;font:15px system-ui}main{max-width:760px;margin:auto;padding:24px 18px 100px}h1{font-size:30px;margin:0}h2{font-size:22px}h3{margin:8px 0}small,.muted{color:#a6b9ad}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{color:#a5ef91;font-weight:800;letter-spacing:-1px}section{background:#1b2721;border:1px solid #304238;border-radius:20px;padding:20px;margin:14px 0}button,input,select,textarea{font:inherit;border-radius:10px;padding:12px;border:1px solid #42564a;background:#142019;color:#eef5ef;max-width:100%}button{cursor:pointer;background:#a5ef91;color:#142019;font-weight:700;border:0}button.alt{background:#304238;color:#eef5ef}input,select,textarea{width:100%;margin:5px 0 12px}textarea{min-height:90px}label{display:block;color:#c5d6c9}nav{position:fixed;bottom:0;left:0;right:0;background:#17231c;border-top:1px solid #42564a;display:flex;justify-content:center;z-index:2}nav button{background:transparent;color:#a6b9ad;flex:1;max-width:150px;font-size:12px;padding:15px 3px}nav button.active{color:#a5ef91}nav span{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{font-size:27px;font-weight:750}.bar{height:8px;background:#35463b;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#a5ef91}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #35463b;padding:12px 0}.line:last-child{border:0}.line input{width:80px;margin:0}.line button{padding:8px}.pill{color:#a5ef91;font-size:12px;text-transform:uppercase;letter-spacing:1px}.wide{width:100%}.ring{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:conic-gradient(#a5ef91 var(--p),#35463b 0)}.ring div{background:#1b2721;width:132px;height:132px;border-radius:50%;display:grid;place-content:center;text-align:center}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #35463b} .warn{color:#f2c58b} @media(max-width:400px){section{padding:14px}.metric{font-size:23px}}
</style><main><header><div><h1 class="brand">MyFit<span style="color:white">.</span></h1><small>YOUR PERSONAL FITNESS STUDIO</small></div><input id="date" type="date" style="width:145px;margin:0"></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');let S={profile:{age:44,height:178,weight:180,sex:'male',activity:1.5,goal:'recomp',days:5,legs:true},meals:{},work:{},measure:[]};try{let x=localStorage.getItem('myfit-v1');if(x)S=JSON.parse(x)}catch(e){}function save(){try{localStorage.setItem('myfit-v1',JSON.stringify(S))}catch(e){alert('Storage unavailable. Export your data before closing.')}}let tab='Home',draft=[]; $('date').value=today();$('date').onchange=()=>render();const day=()=>$('date').value;const goals={recomp:'Body recomposition',bulk:'Muscle gain',cut:'Fat loss',maintain:'Maintenance',mobility:'Mobility & fitness'};function targets(){let p=S.profile,w=p.weight/2.20462,b=10*w+6.25*p.height-5*p.age+(p.sex==='male'?5:-161),m=b*p.activity,k=Math.round((m+({recomp:-100,bulk:250,cut:-350,maintain:0,mobility:0}[p.goal]))/50)*50,pr=Math.round(w*(p.goal==='cut'?2.1:1.9)),f=Math.round(k*.27/9);return [k,pr,Math.round((k-pr*4-f*9)/4),f]}
const foods=[['chicken thighs skin on',232,23.3,0,14.7,100,130,'chicken thighs|chicken thigh'],['chicken thighs skinless',179,25,0,8,100,130,'skinless chicken thigh'],['chicken breast',165,31,0,3.6,100,150,'chicken breast|chicken'],['white rice',130,2.7,28.2,.3,158,158,'white rice|rice'],['broccoli',35,2.4,7.2,.4,156,156,'broccoli'],['salmon',208,22,0,13,100,150,'salmon'],['egg',143,12.6,.7,9.5,50,50,'eggs|egg'],['oats dry',389,16.9,66,6.9,80,40,'oatmeal|oats'],['banana',89,1.1,23,.3,118,118,'banana'],['greek yogurt',73,10,4,2,245,170,'greek yogurt|yogurt'],['olive oil',884,0,0,100,216,14,'olive oil|oil'],['peanut butter',588,25,20,50,258,16,'peanut butter'],['lean ground beef',217,26,0,12,100,150,'ground beef|beef'],['turkey',170,29,0,6,100,150,'turkey'],['sweet potato',90,2,21,.2,200,150,'sweet potato'],['potato',87,2,20,.1,150,150,'potatoes|potato'],['bread',265,9,49,3.2,100,30,'toast|bread'],['apple',52,.3,14,.2,125,182,'apple'],['protein powder',400,80,8,5,120,30,'protein shake|whey|protein powder'],['pasta',158,5.8,31,.9,140,140,'pasta'],['shrimp',99,24,0,.3,145,150,'shrimp'],['black beans',132,9,24,.5,172,172,'beans'],['almonds',579,21,22,50,143,28,'almonds'],['avocado',160,2,9,15,150,150,'avocado'],['tuna',116,26,0,1,154,120,'tuna'],['milk',50,3.4,5,2,244,244,'milk']];
function parse(){let t=$('mealtext').value.toLowerCase().replace(/\b(two|three|four|one|half)\b/g,x=>({two:'2',three:'3',four:'4',one:'1',half:'0.5'}[x]));draft=t.split(/,|\band\b|\n/).map(s=>{let matches=foods.filter(f=>f[7].split('|').some(a=>s.includes(a)));let f=matches.sort((a,b)=>Math.max(...b[7].split('|').filter(x=>s.includes(x)).map(x=>x.length))-Math.max(...a[7].split('|').filter(x=>s.includes(x)).map(x=>x.length)))[0];if(s.includes('skinless')&&s.includes('thigh'))f=foods[1];if(!f)return {name:s.trim(),g:100,manual:true,k:0,p:0,c:0,f:0};let n=s.match(/(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)/),q=n?n[0].split(' ').reduce((a,v)=>a+(v.includes('/')?Number(v.split('/')[0])/Number(v.split('/')[1]):Number(v)),0):1;let g=s.match(/\b(?:g|grams?)\b/)?q:s.match(/\b(?:oz|ounces?)\b/)?q*28.35:s.includes('cup')?q*f[5]:s.includes('tbsp')?q*14:s.includes('tsp')?q*4.5:q*f[6];return {name:f[0],g:Math.round(g),k:f[1],p:f[2],c:f[3],f:f[4]}}).filter(x=>x.name);drawDraft()}
function totals(items){return ['k','p','c','f'].map(k=>Math.round(items.reduce((a,x)=>a+x[k]*x.g/100,0)))}function meals(){return S.meals[day()]||[]}function sum(){return totals(meals().flatMap(x=>x.items))}function bars(a,t){return ['Calories','Protein','Carbs','Fat'].map((n,i)=>`<div class="line"><span>${n}</span><b>${a[i]} / ${t[i]} ${i?'g':'kcal'}</b></div><div class="bar"><i style="width:${Math.min(100,a[i]/t[i]*100)}%"></i></div>`).join('')}
const ex={lower:['Leg press|3|8–12','Leg extension|3|12–15','Seated hamstring curl|3|10–15','Calf raise|3|12–20'],posterior:['Hip thrust|3|10–12','Dumbbell Romanian deadlift|3|8–12','Leg press|3|10–12','Hamstring curl|3|12–15','Calf raise|3|15–20'],push:['Dumbbell bench press|3|8–12','Incline press|3|8–12','Seated shoulder press|3|8–12','Lateral raise|3|12–15','Triceps pushdown|2|12–15'],pull:['Lat pulldown|3|8–12','Chest-supported row|3|10–12','Cable row|2|10–12','Face pull|2|15','Biceps curl|3|10–12'],upper:['Dumbbell bench press|3|8–12','Lat pulldown|3|8–12','Chest-supported row|3|10–12','Lateral raise|2|15','Biceps curl|2|12','Triceps pushdown|2|12'],full:['Leg press|2|12','Incline press|3|10','Lat pulldown|3|10','Hamstring curl|2|12','Lateral raise|2|15','Plank|2|30–45 sec'],mobility:['Brisk walk|1|25 min','Hip flexor stretch|2|30 sec/side','Hamstring stretch|2|30 sec/side','90/90 hip stretch|2|30 sec/side','Dead bug|2|10/side'],rest:[]};const names={lower:'Quads & calves',posterior:'Hamstrings & glutes',push:'Chest, shoulders & triceps',pull:'Back & biceps',upper:'Upper body',full:'Full body',mobility:'Cardio & mobility',rest:'Recovery'};function schedule(){let p=S.profile;if(p.goal==='mobility'||p.days==3)return ['full','mobility','full','rest','full','mobility','rest'];if(p.days==4||p.goal==='cut'||p.goal==='maintain')return ['lower','upper','mobility','posterior','upper','mobility','rest'];return ['lower','push','mobility','pull','posterior','full','rest']}function workout(){return schedule()[(new Date(day()+'T12:00:00').getDay()+6)%7]}
function render(){let t=targets(),a=sum(),w=workout();$('nav').innerHTML=['Home','Food','Workout','Planner','Goals','Progress'].map((n,i)=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()"><span>${['⌂','◉','◆','▦','◎','↗'][i]}</span>${n}</button>`).join('');let h='';if(tab==='Home')h=`<div class="pill">${goals[S.profile.goal]}</div><h2>Your daily overview</h2><section><div class="ring" style="--p:${Math.min(100,a[0]/t[0]*100)}%"><div><span class="metric">${a[0]}</span><small>of ${t[0]} kcal</small></div></div><center>${t[0]-a[0]} kcal remaining</center>${bars(a,t)}<button class="wide" onclick="tab='Food';render()">+ Log a meal</button></section><section><small>TODAY'S TRAINING</small><h2>${names[w]}</h2><button onclick="tab='Workout';render()">Open workout</button></section>`;if(tab==='Food')h=`<h2>Food diary</h2><section>${bars(a,t)}</section><section><h3>Describe your meal</h3><textarea id="mealtext" placeholder="2 chicken thighs with skin on, 1 cup white rice, 1 cup broccoli"></textarea><button onclick="parse()">Estimate nutrition</button><p class="muted">Use commas between foods. Estimates assume cooked edible portions except dry oats. Confirm weights and add oils or sauces separately.</p><div id="draft"></div></section><section><h3>Logged meals</h3>${meals().map((m,i)=>`<div class="line"><div>${esc(m.items.map(x=>x.name).join(', '))}<br><small>${totals(m.items)[0]} kcal</small></div><button class="alt" onclick="S.meals[day()].splice(${i},1);save();render()">Delete</button></div>`).join('')||'No meals logged yet.'}</section>`;if(tab==='Workout')h=`<h2>Training</h2><section>${schedule().map((x,i)=>`<div class="line"><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small><b>${names[x]}</b></div>`).join('')}</section><section><h3>${names[w]}</h3><small>Warm up first. Leave 1–3 reps in reserve. No barbell back squats.</small>${ex[w].map((x,i)=>{let [n,s,r]=x.split('|');let key=day()+'|'+n,log=S.work[key]||{};return `<div class="line"><div><b>${n}</b><br><small>${s} sets × ${r}</small></div><input aria-label="Weight in pounds" type="number" min="0" placeholder="lb" value="${esc(log.weight||'')}" onchange="record('${n}','weight',this.value)"><input aria-label="Sets completed" type="number" min="0" max="${s}" placeholder="sets" value="${esc(log.sets||'')}" onchange="record('${n}','sets',this.value)"></div>`}).join('')||'Take an easy walk and recover.'}<p class="muted">Enter weight and completed sets; entries save automatically. For mobility, leave weight blank.</p></section>`;if(tab==='Goals')h=`<h2>Your goals</h2><section><label>Primary goal<select id="goal">${Object.entries(goals).map(([k,v])=>`<option value="${k}" ${S.profile.goal===k?'selected':''}>${v}</option>`)}</select></label>${[['age','Age'],['height','Height (cm)'],['weight','Weight (lb)']].map(([k,n])=>`<label>${n}<input id="${k}" type="number" value="${S.profile[k]}"></label>`).join('')}<label>Sex used for calorie estimate<select id="sex"><option value="male" ${S.profile.sex==='male'?'selected':''}>Male</option><option value="female" ${S.profile.sex==='female'?'selected':''}>Female</option></select></label><label>Activity<select id="activity">${[[1.2,'Sedentary'],[1.375,'Light'],[1.5,'Moderate'],[1.725,'Very active']].map(([v,n])=>`<option value="${v}" ${S.profile.activity==v?'selected':''}>${n}</option>`)}</select></label><label>Preferred lifting days<select id="days">${[3,4,5].map(v=>`<option ${S.profile.days==v?'selected':''}>${v}</option>`)}</select></label><button class="wide" onclick="updateGoals()">Apply goals & regenerate plan</button><p class="muted">Calorie estimates are provisional. Fat loss and maintenance cap lifting at four days; mobility uses three. Back squats excluded.</p></section><section>${bars([0,0,0,0],t)}</section>`;if(tab==='Planner'){let breakfasts=['Protein oats & banana','Eggs & toast','Greek yogurt & berries'],lunch=['Jerk chicken & rice','Turkey & pasta','Tuna & potato','Chicken & beans'],dinner=['Salmon & sweet potato','Lean beef & rice','Shrimp & pasta','Chicken & potatoes'];h=`<h2>30-day meal plan</h2><section><div class="pill">${t[0]} kcal daily target</div><p>Starting portions: ${Math.round(t[0]/2450*150)} g cooked protein, ${Math.round(t[0]/2450*160)} g cooked starch and 150 g vegetables per main meal. Add breakfast and snacks to meet your targets. This is a meal template, not an exact macro-matched menu.</p></section>${Array.from({length:4},(_,i)=>`<section><h3>Week ${i+1}</h3><table><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr>${Array.from({length:i===3?9:7},(_,j)=>`<tr><td>${i*7+j+1}</td><td>${breakfasts[(i+j)%3]}</td><td>${lunch[(i+Math.floor(j/2))%4]}</td><td>${dinner[(i+j)%4]}</td></tr>`).join('')}</table></section>`).join('')}<section><h3>Weekly grocery guide</h3>Chicken, turkey, salmon, shrimp, eggs, Greek yogurt, oats, rice, potatoes, pasta, beans, broccoli, mixed vegetables, fruit and olive oil. Prep twice weekly; freeze later portions.</section>`}if(tab==='Progress')h=`<h2>Progress journal</h2><section>${['Weight (lb)','Waist (in)','Chest (in)','Thigh (in)','Arm (in)'].map((n,i)=>`<label>${n}<input type="number" min="0" step="0.1" id="m${i}"></label>`).join('')}<button onclick="measure()">Save measurements</button></section><section><h3>History</h3>${S.measure.map(m=>`<div class="line"><small>${esc(m.date)}</small><span>${m.v.map((v,i)=>v?['Weight','Waist','Chest','Thigh','Arm'][i]+': '+esc(v):'').filter(Boolean).join(' · ')}</span></div>`).join('')||'No measurements yet.'}</section><section><h3>Data backup</h3><button onclick="backup()">Export JSON</button><label style="margin-top:12px">Restore backup<input type="file" accept=".json" onchange="restore(this)"></label><small>Data stays in this browser when local storage is supported. Export regularly.</small></section>`;$('app').innerHTML=h;if(tab==='Food')drawDraft()}
function drawDraft(){if(!$('draft'))return;$('draft').innerHTML=draft.length?draft.map((x,i)=>`<div class="line"><div><b>${esc(x.name)}</b><br><small>${x.manual?'Unknown food — enter label values below':Math.round(x.k*x.g/100)+' kcal'}</small></div><input type="number" min="1" aria-label="Grams" value="${x.g}" onchange="draft[${i}].g=Math.max(0,+this.value);drawDraft()"><button class="alt" onclick="draft.splice(${i},1);drawDraft()">×</button></div>${x.manual?['k','p','c','f'].map((k,j)=>`<label>${['Calories','Protein g','Carbs g','Fat g'][j]} per 100 g<input type="number" min="0" value="${x[k]}" onchange="draft[${i}].${k}=Math.max(0,+this.value)"></label>`).join(''):''}`).join('')+`<button class="wide" onclick="logMeal()">Confirm & log meal</button>`:''}function logMeal(){if(draft.some(x=>x.manual&&!x.k)){alert('Enter calories for unknown foods or remove them.');return}(S.meals[day()]??=[]).push({items:draft});draft=[];save();render()}function record(n,k,v){let key=day()+'|'+n;(S.work[key]??={})[k]=v;save()}function updateGoals(){let p={...S.profile};for(let k of ['age','height','weight','activity','days'])p[k]=+$(k).value;for(let k of ['sex','goal'])p[k]=$(k).value;if(p.age<18||p.age>100||p.height<120||p.height>230||p.weight<80||p.weight>600){alert('Check adult profile values.');return}S.profile=p;save();render()}function measure(){let v=Array.from({length:5},(_,i)=>$('m'+i).value);if(!v.some(Boolean))return;S.measure.push({date:day(),v});save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='myfit-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.profile||!x.meals||!x.work||!Array.isArray(x.measure))throw 0;S=x;save();render()}catch(e){alert('Invalid backup')}}render();</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></html>
